<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cho Bok Yun - 명함</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eee;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .card-wrap {
    position: relative;
    width: 100%;
    max-width: 550px;
  }
  .card-wrap img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  }
  .download-btn {
    position: absolute;
    left: 6.2%;
    top: 91%;
    width: 32%;
    height: 7.5%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid #333;
    border-radius: 4px;
    color: #222;
    text-decoration: none;
    font-size: clamp(9px, 2.4vw, 13px);
    letter-spacing: 0.02em;
    background: rgba(255,255,255,0.85);
    transition: background 0.15s ease;
  }
  .download-btn:active {
    background: rgba(230,230,230,0.95);
  }
</style>
</head>
<body>
  <div class="card-wrap">
    <img src="vcard_cho2.jpg" alt="Cho Bok Yun 명함">
    <a class="download-btn" href="vcard_cho2.jpg" download="vcard_cho2.jpg">다운로드</a>
  </div>
</body>
</html>
